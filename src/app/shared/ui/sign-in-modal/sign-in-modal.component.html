<div role="dialog" aria-modal="true" aria-labelledby="sign-in-dialog-title" class="surface-card w-md max-w-full">
  <div class="modal-header border-b-2 border-surface-border">
    <h2 id="sign-in-dialog-title" class="text-xl font-bold text-primary">Sign In</h2>
    <button
      type="button"
      class="modal-close-btn focus-visible:outline-2 focus-visible:outline-primary-hover"
      (click)="onClose()"
      aria-label="Close dialog"
    >
      <app-close-icon />
    </button>
  </div>

  @if (errorMessage(); as msg) {
    <div class="error-block my-2 text-sm" role="alert">
      {{ msg }}
    </div>
  }

  <form [formRoot]="signInForm" class="flex flex-col gap-4">
    <label for="sign-in-email" class="form-field-label">
      EMAIL ADDRESS
      <input
        id="sign-in-email"
        type="email"
        autocomplete="username"
        class="form-input mt-1.5"
        [formField]="signInForm.email"
      />
      @if (signInForm.email().touched() && signInForm.email().invalid()) {
        @for (error of signInForm.email().errors(); track error) {
          <span class="text-error-text mt-1 block">{{ error.message }}</span>
        }
      }
    </label>

    <label for="sign-in-password" class="form-field-label">
      PASSWORD
      <input
        id="sign-in-password"
        type="password"
        autocomplete="current-password"
        class="form-input mt-1.5"
        [formField]="signInForm.password"
      />
      @if (signInForm.password().touched() && signInForm.password().invalid()) {
        @for (error of signInForm.password().errors(); track error) {
          <span class="text-error-text mt-1 block">{{ error.message }}</span>
        }
      }
    </label>

    <button type="submit" class="mt-2 btn-primary w-full" [disabled]="signInForm().submitting()">
      @if (signInForm().submitting()) {
        <app-spinner-icon class="w-5 h-5" />
        <span>Signing in...</span>
      } @else {
        <span>Sign In</span>
      }
    </button>
  </form>
</div>

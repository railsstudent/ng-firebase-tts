<div
  role="dialog"
  aria-modal="true"
  aria-labelledby="sign-in-dialog-title"
  class="modal-card shadow-2xl backdrop-blur-md"
>
  <div class="modal-header border-b border-surface-border/60">
    <h2 id="sign-in-dialog-title" class="modal-title font-bold text-primary">Sign In</h2>
    <button type="button" class="modal-close-btn p-1.5 rounded-lg" (click)="onClose()" aria-label="Close dialog">
      <app-close-icon />
    </button>
  </div>

  @if (errorMessage(); as msg) {
    <div class="error-block" role="alert">
      {{ msg }}
    </div>
  }

  <form [formRoot]="signInForm" class="flex flex-col gap-4">
    <label for="sign-in-email" class="form-label font-semibold tracking-wider">
      Email Address
      <input
        id="sign-in-email"
        type="email"
        autocomplete="username"
        class="form-input w-full bg-app-bg"
        [formField]="signInForm.email"
      />
      @if (signInForm.email().touched() && signInForm.email().invalid()) {
        @for (error of signInForm.email().errors(); track error) {
          <span class="error-hint mt-1 block">{{ error.message }}</span>
        }
      }
    </label>

    <label for="sign-in-password" class="form-label font-semibold tracking-wider">
      Password
      <input
        id="sign-in-password"
        type="password"
        autocomplete="current-password"
        class="form-input w-full bg-app-bg"
        [formField]="signInForm.password"
      />
      @if (signInForm.password().touched() && signInForm.password().invalid()) {
        @for (error of signInForm.password().errors(); track error) {
          <span class="error-hint mt-1 block">{{ error.message }}</span>
        }
      }
    </label>

    <button type="submit" class="btn-submit btn-primary w-full" [disabled]="signInForm().submitting()">
      @if (signInForm().submitting()) {
        <app-spinner-icon class="w-5 h-5" />
        <span>Signing in...</span>
      } @else {
        <span>Sign In</span>
      }
    </button>
  </form>
</div>

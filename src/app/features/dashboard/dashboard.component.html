<section class="dashboard-main">
  <app-analyzer-panel [(analysis)]="analysis" />
  @let imageAnalysis = analysis();
  @defer (when imageAnalysis?.tokenUsage || imageAnalysis?.optimizationMetrics) {
    <app-usage-metrics
      [tokenUsage]="imageAnalysis?.tokenUsage"
      [optimizationMetrics]="imageAnalysis?.optimizationMetrics"
    />
  }
  @defer (when imageAnalysis?.thought) {
    <app-thought-summary [thought]="imageAnalysis?.thought || ''" />
  }
</section>

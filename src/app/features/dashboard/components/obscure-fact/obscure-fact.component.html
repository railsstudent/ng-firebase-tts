<div class="section-wrapper">
  <app-audio-tags [(audioPromptModel)]="audioPromptModel" />
  <h3 class="section-title">A surprising or obscure fact about the tags</h3>
  @if (interestingFact()) {
    <p class="obscure-fact-text">{{ interestingFact() }}</p>
    <app-error-display [error]="ttsError()" />
    @let voice = audioPromptModel().voiceOption;
    <app-text-to-speech
      [voice]="voice"
      [interestingFact]="interestingFact()"
      [audioPrompt]="audioPrompt()"
      [(ttsError)]="ttsError"
    />
  } @else {
    <p class="empty-message mb-2">Upload an image to discover an obscure fact and generate speech.</p>
  }
</div>

<div class="w-full mt-6">
  <h3 class="section-title">Suggested Tags</h3>
  <div
    ngListbox
    class="flex flex-wrap gap-2"
    orientation="horizontal"
    selectionMode="explicit"
    multi="false"
    [aria-label]="tagAriaLabel()"
  >
    @for (tag of tags(); track tag) {
      <div ngOption #optionRef="ngOption" [value]="tag" [label]="tag" class="tag-option">
        <span class="tag-pill" [class]="{ 'tag-pill-selected': optionRef.selected() }">{{ tag }}</span>
      </div>
    } @empty {
      <p class="text-center text-muted italic">No tags were generated for this image.</p>
    }
  </div>
</div>

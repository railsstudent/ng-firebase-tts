<div class="section-wrapper">
  <h3 class="section-title">A surprising or obscure fact about the tags</h3>
  @if (interestingFact()) {
    <p class="obscure-fact-text">{{ interestingFact() }}</p>
  }

  <div class="audio-customize-container">
    <h3 class="audio-customize-title"><span>🎙️</span> Customize Audio Generation</h3>

    <div class="audio-customize-grid">
      <!-- Scene -->
      <div class="form-field-group-full">
        <label for="scene" class="form-field-label">Scene Description</label>
        <textarea
          id="scene"
          [formField]="audioPromptForm.scene"
          placeholder="Describe the environment..."
          class="form-field-textarea"
        ></textarea>
      </div>

      <!-- Emotion -->
      <div class="form-field-group">
        <label for="emotion" class="form-field-label">Vocal Emotion</label>
        <input
          type="text"
          id="emotion"
          [formField]="audioPromptForm.emotion"
          placeholder="e.g., panicked, whispers"
          class="form-field-input"
        />
      </div>

      <!-- Pace -->
      <div class="form-field-group">
        <label for="pace" class="form-field-label">Speaking Pace</label>
        <input
          type="text"
          id="pace"
          [formField]="audioPromptForm.pace"
          placeholder="e.g., very slow, rapid"
          class="form-field-input"
        />
      </div>

      <!-- Voice Option -->
      <app-voice-selector [selectedValue]="selectedValue()" (selectedValueChange)="onVoiceChange($event)" />
    </div>
  </div>

  <app-error-display [error]="ttsError()" />

  <div>
    <div class="btn-container">
      <button (click)="generateSpeech('sync')" aria-label="Generate speech" [disabled]="isLoading()" class="btn-audio">
        @let c = { isLoading: loadingMode() === 'sync', buttonText: 'Play Speech (Sync)' };
        <ng-container [ngTemplateOutlet]="buttonTemplate" [ngTemplateOutletContext]="c" />
      </button>
      <button (click)="generateSpeech('stream')" aria-label="Stream speech" [disabled]="isLoading()" class="btn-audio">
        @let c2 = { isLoading: loadingMode() === 'stream', buttonText: 'Play Speech (Stream)' };
        <ng-container [ngTemplateOutlet]="buttonTemplate" [ngTemplateOutletContext]="c2" />
      </button>
      <button
        (click)="generateSpeech('web_audio_api')"
        aria-label="Stream speech"
        [disabled]="isLoading()"
        class="btn-audio"
      >
        @let c3 =
          {
            isLoading: loadingMode() === 'web_audio_api',
            genText: `Speak (Playback rate: ${playbackRate()})`,
            buttonText: `Web Audio API`,
          };
        <ng-container [ngTemplateOutlet]="buttonTemplate" [ngTemplateOutletContext]="c3" />
      </button>
    </div>
  </div>

  @if (!isLoading() && audioUrl(); as url) {
    <figure class="playback-figure">
      <figcaption class="playback-caption">Listen to the Gemini-TTS:</figcaption>
      <audio controls [src]="url" [playbackRate]="'1.25'" class="playback-audio"></audio>
    </figure>
  }

  <ng-template #buttonTemplate let-isLoading="isLoading" let-buttonText="buttonText" let-genText="genText">
    @if (isLoading) {
      <app-spinner-icon class="spinner-icon" />
    }
    {{ isLoading ? genText || 'Generating Speech...' : buttonText }}
  </ng-template>
</div>

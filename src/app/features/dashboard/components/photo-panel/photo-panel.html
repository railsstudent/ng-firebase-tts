<div>
  @let imageAnalysis = analysis();
  @let parsed = imageAnalysis?.parsed;
  <app-photo-upload
    [previewUrl]="previewUrl()"
    [isLoading]="isLoading()"
    [acceptedFileTypes]="acceptedTypes"
    (fileChange)="handleFileChange($event)"
    (generate)="handleGenerateClick()"
    (removeFile)="handleFileChange(undefined)"
  />

  @let tags = parsed?.tags || [];
  @let hasTags = tags.length > 0;
  @defer (when hasTags) {
    <app-tags-display [tags]="tags" />
  } @placeholder {
    <div class="tags-wrapper">
      <h2 class="tags-title">Suggested Tags</h2>
      <p class="no-tags-message">No tags were generated for this image.</p>
    </div>
  }
  <app-obscure-fact [interestingFact]="parsed?.fact" />
</div>

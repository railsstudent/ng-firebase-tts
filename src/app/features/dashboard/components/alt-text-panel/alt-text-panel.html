<div class="panel-container">
  @let imageAnalysis = analysis();
  @let errorMessage = error() || '';
  <app-error-display [error]="errorMessage" />
  @if (!isLoading() && !error() && !imageAnalysis) {
    <div class="empty-state">
      <p>Upload an image and click "Generate" to see the results.</p>
    </div>
  }
  @if (isLoading()) {
    <div class="loading-state">
      <app-spinner-icon class="loading-spinner" />
      <p class="loading-text">Firebase AI is thinking...</p>
    </div>
  }
  @if (!isLoading() && imageAnalysis) {
    <div class="results-wrapper">
      <app-alt-text-display [altText]="analysis()?.parsed?.alternativeText || 'Default alternative text'" />
      <app-recommendations-display [recommendations]="analysis()?.parsed?.recommendations || []" />
    </div>
  }
  <app-grounding [metadata]="imageAnalysis?.metadata" />
</div>

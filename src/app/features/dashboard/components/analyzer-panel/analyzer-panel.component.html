<div class="panel-grid">
  <!-- Left Side: Uploader and Image Preview -->
  <app-photo-panel
    [(analysis)]="analysis"
    [(error)]="error"
    [isLoading]="isLoading()"
    (emitFile)="handleGenerateClick($event)"
  />

  @defer (when isLoading() || error() || analysis()) {
    <!-- Right Side: Results -->
    <app-alt-text-panel [analysis]="analysis()" [error]="error()" [isLoading]="isLoading()" />
  } @placeholder {
    <div class="panel-container">
      <div class="empty-state">
        <p>Upload an image and click "Generate" to see the results.</p>
      </div>
    </div>
  }
</div>

<div class="flex flex-col form-field-group-full">
  <label for="voiceOption" class="form-field-label">AI VOICE MODEL</label>
  <div
    id="voiceOption"
    ngCombobox
    #comboboxRef="ngCombobox"
    [(expanded)]="popupExpanded"
    [preserveContent]="true"
    class="voice-trigger justify-between bg-app-bg"
    aria-label="AI Voice Model"
  >
    <div class="flex items-center gap-2.5">
      <span class="font-medium text-primary">
        {{ displayLabel() }}
      </span>
      <app-arrow-drop-down-icon />
    </div>

    <ng-template
      [cdkConnectedOverlay]="{ origin: comboboxRef.element, usePopover: 'inline', matchWidth: true }"
      [cdkConnectedOverlayOpen]="popupExpanded()"
    >
      <ng-template ngComboboxPopup [combobox]="comboboxRef">
        <div class="voice-popup-container shadow-2xl backdrop-blur-md">
          <div
            #listbox="ngListbox"
            ngListbox
            ngComboboxWidget
            [tabindex]="-1"
            focusMode="activedescendant"
            selectionMode="explicit"
            [value]="[selectedValue()]"
            (valueChange)="selectedValue.set($event[0])"
            [activeDescendant]="listbox.activeDescendant()"
            (click)="onCommit()"
            (keydown.enter)="onCommit()"
            (keydown.space)="onCommit()"
          >
            @for (option of sortedVoiceOptions; track option.name) {
              <div ngOption [value]="option.name" [label]="option.label">
                <app-mic-icon />
                <span class="flex-1 text-secondary">{{ option.label }}</span>
                <app-check-icon />
              </div>
            }
          </div>
        </div>
      </ng-template>
    </ng-template>
  </div>
</div>

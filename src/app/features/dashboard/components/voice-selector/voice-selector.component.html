<div class="flex flex-col gap-1.5">
  <label for="voiceOption" class="form-field-label">AI VOICE MODEL</label>
  <div
    id="voiceOption"
    ngCombobox
    #comboboxRef="ngCombobox"
    [(expanded)]="popupExpanded"
    [preserveContent]="true"
    class="form-input voice-trigger justify-between"
    aria-label="AI Voice Model"
  >
    <span class="font-medium">
      {{ displayLabel() }}
    </span>
    <app-arrow-drop-down-icon [class]="popupExpanded() ? 'rotate-180 text-primary-accent' : ''" />

    <ng-template
      [cdkConnectedOverlay]="{ origin: comboboxRef.element, usePopover: 'inline', matchWidth: true }"
      [cdkConnectedOverlayOpen]="popupExpanded()"
    >
      <ng-template ngComboboxPopup [combobox]="comboboxRef">
        <div
          #listbox="ngListbox"
          ngListbox
          ngComboboxWidget
          class="voice-popup-container border border-surface-border outline-none"
          [tabindex]="-1"
          focusMode="activedescendant"
          selectionMode="explicit"
          [value]="[selectedValue()]"
          (valueChange)="selectedValue.set($event[0])"
          [activeDescendant]="listbox.activeDescendant()"
          (click)="onCommit()"
          (keydown.enter)="onCommit()"
          (keydown.space)="onCommit()"
        >
          @for (option of sortedVoiceOptions; track option.name) {
            <div
              ngOption
              #opt="ngOption"
              class="flex items-center gap-2.5"
              [value]="option.name"
              [label]="option.label"
            >
              <app-mic-icon />
              <span class="flex-1">{{ option.label }}</span>
              <app-check-icon [class.invisible]="!opt.selected()" />
            </div>
          }
        </div>
      </ng-template>
    </ng-template>
  </div>
</div>

<div class="flex flex-col items-center">
  <input #fileInput type="file" (change)="onFileChange($event)" [attr.accept]="accepted" class="hidden" />
  @if (!previewUrl()) {
    @let dragClasses = 'outline-none bg-surface-hover border-primary-indigo text-primary-accent scale-102';
    @let normalClasses =
      'outline-none border-surface-border text-muted hover:bg-surface-card hover:border-surface-hover';
    <button
      type="button"
      (click)="fileInput.click()"
      (dragover)="handleDrag($event)"
      (dragleave)="handleDrag($event, false)"
      (drop)="onDrop($event)"
      class="dropzone border-2 border-dashed"
      [class]="isDragActive() ? dragClasses : normalClasses"
    >
      <app-photo-icon />
      <p class="upload-title pointer-events-none font-semibold">Click to upload an image</p>
      <p class="pointer-events-none text-xs sm:text-sm">PNG, JPG, JPEG or WEBP</p>
    </button>
  } @else {
    <div class="w-full relative group">
      <img [src]="previewUrl()" alt="Selected preview" class="preview-image border-2 border-surface-border" />
      <div class="action-overlay top-3 right-6">
        <button
          type="button"
          (click)="fileInput.click()"
          aria-label="Select a new image"
          class="btn-image-selector focus-visible:outline-2 focus-visible:outline-primary-accent"
        >
          Change Image
        </button>
        <button
          type="button"
          (click)="fileChange.emit(undefined)"
          aria-label="Remove the image"
          class="btn-image-selector focus-visible:outline-2 focus-visible:outline-primary-accent"
        >
          Remove Image
        </button>
      </div>
    </div>
  }
  <button
    type="button"
    (click)="generate.emit()"
    [disabled]="!previewUrl() || isLoading()"
    class="w-full btn-primary mt-6"
  >
    @if (isLoading()) {
      <app-spinner-icon class="w-5 h-5" />
    }
    {{ isLoading() ? 'Analyzing...' : 'Generate Description' }}
  </button>
</div>

<div class="upload-wrapper items-center justify-center">
  <input #fileInput type="file" (change)="onFileChange($event)" [attr.accept]="accepted" class="hidden" />
  @if (!previewUrl()) {
    <button
      type="button"
      (click)="fileInput.click()"
      (dragover)="handleDrag($event)"
      (dragleave)="handleDrag($event, false)"
      (drop)="onDrop($event)"
      class="dropzone w-full rounded-xl"
      [class.drag-active]="isDragActive()"
    >
      <app-photo-icon />
      <p class="upload-title pointer-events-none font-semibold">Click to upload an image</p>
      <p class="upload-subtitle pointer-events-none text-muted">PNG, JPG, JPEG or WEBP</p>
    </button>
  } @else {
    <div class="w-full relative group">
      <img [src]="previewUrl()!" alt="Selected preview" class="preview-image rounded-xl shadow-lg" />
      <div class="action-overlay top-3 right-6">
        <button
          type="button"
          (click)="fileInput.click()"
          aria-label="Select a new image"
          class="mb-2 btn-image-selector backdrop-blur-sm"
        >
          Change Image
        </button>
        <button
          type="button"
          (click)="fileChange.emit(undefined)"
          aria-label="Remove the image"
          class="btn-image-selector backdrop-blur-sm"
        >
          Remove Image
        </button>
      </div>
    </div>
  }
  <button
    type="button"
    (click)="generate.emit()"
    [disabled]="!previewUrl() || isLoading()"
    class="btn-generate btn-primary mt-6"
  >
    @if (isLoading()) {
      <app-spinner-icon class="w-5 h-5" />
    }
    {{ isLoading() ? 'Analyzing...' : 'Generate Description' }}
  </button>
</div>
